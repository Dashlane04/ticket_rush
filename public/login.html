<!DOCTYPE html>
<!-- Giao diện chính: Next.js (fe/frontend) chạy cổng 3001 — đăng nhập/đăng ký. Trang này gọi trực tiếp API Nest, dùng cùng localStorage ticket_rush_tokens. -->
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Đăng nhập — Ticket Rush</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --page-bg: #0d1117;
      --card-bg: #1a1f2b;
      --input-bg: #0f172a;
      --accent: #e91e63;
      --accent-hover: #f06292;
      --text: #ffffff;
      --muted: #a8b0c4;
      --border: rgba(255, 255, 255, 0.08);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      font-family: "DM Sans", system-ui, sans-serif;
      background: var(--page-bg);
      color: var(--text);
    }
    .card {
      width: 100%;
      max-width: 420px;
      background: var(--card-bg);
      border-radius: 20px;
      padding: 40px 36px 36px;
      box-shadow: 0 24px 48px rgba(0, 0, 0, 0.45);
    }
    h1 {
      margin: 0 0 10px;
      font-family: "Playfair Display", Georgia, serif;
      font-size: 2rem;
      font-weight: 700;
      text-align: center;
    }
    .subtitle {
      margin: 0 0 32px;
      text-align: center;
      font-size: 0.9375rem;
      color: var(--muted);
    }
    label { display: block; margin-bottom: 8px; font-size: 0.875rem; color: var(--muted); }
    .field { margin-bottom: 20px; }
    .input-wrap {
      display: flex;
      align-items: center;
      gap: 12px;
      background: var(--input-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 0 14px;
    }
    .input-wrap:focus-within {
      border-color: rgba(233, 30, 99, 0.45);
      box-shadow: 0 0 0 3px rgba(233, 30, 99, 0.12);
    }
    .input-wrap svg { flex-shrink: 0; opacity: 0.65; }
    input {
      flex: 1;
      border: none;
      background: transparent;
      color: var(--text);
      font: inherit;
      font-size: 0.9375rem;
      padding: 14px 0;
      outline: none;
    }
    input::placeholder { color: #5c6578; }
    .submit {
      width: 100%;
      margin-top: 8px;
      padding: 16px 20px;
      border: none;
      border-radius: 999px;
      background: var(--accent);
      color: #fff;
      font: inherit;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }
    .submit:hover { background: var(--accent-hover); }
    .submit:disabled { opacity: 0.65; cursor: not-allowed; }
    .footer { margin-top: 28px; text-align: center; font-size: 0.9375rem; color: var(--muted); }
    .footer a { color: var(--accent); text-decoration: none; font-weight: 600; }
    .footer a:hover { text-decoration: underline; }
    .msg { margin-bottom: 16px; padding: 12px 14px; border-radius: 10px; font-size: 0.875rem; display: none; }
    .msg.show { display: block; }
    .msg.error { background: rgba(233, 30, 99, 0.12); color: #ffb3c9; border: 1px solid rgba(233, 30, 99, 0.35); }
    .msg.ok { background: rgba(46, 160, 67, 0.15); color: #7ee0a0; border: 1px solid rgba(46, 160, 67, 0.35); }
  </style>
</head>
<body>
  <div class="card">
    <h1>Đăng Nhập</h1>
    <p class="subtitle">Chào mừng quay lại</p>
    <div id="msg" class="msg" role="alert"></div>
    <form id="form" novalidate>
      <div class="field">
        <label for="email">Email</label>
        <div class="input-wrap">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
            <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z" />
            <polyline points="22,6 12,13 2,6" />
          </svg>
          <input id="email" type="email" autocomplete="email" placeholder="hello@example.com" required />
        </div>
      </div>
      <div class="field">
        <label for="password">Mật khẩu</label>
        <div class="input-wrap">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
            <rect x="3" y="11" width="18" height="11" rx="2" ry="2" />
            <path d="M7 11V7a5 5 0 0 1 10 0v4" />
          </svg>
          <input id="password" type="password" autocomplete="current-password" placeholder="••••••••" required />
        </div>
      </div>
      <button type="submit" class="submit" id="submit">Đăng nhập <span>→</span></button>
    </form>
    <p class="footer">Chưa có tài khoản? <a href="/signup.html">Đăng ký</a></p>
  </div>
  <script>
    const form = document.getElementById("form");
    const msg = document.getElementById("msg");
    const submit = document.getElementById("submit");
    function showMessage(type, text) {
      msg.className = "msg show " + type;
      msg.textContent = text;
    }
    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      msg.className = "msg";
      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;
      submit.disabled = true;
      try {
        const res = await fetch("/auth/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ email, password }),
        });
        const data = await res.json().catch(() => ({}));
        if (!res.ok) {
          showMessage("error", Array.isArray(data.message) ? data.message.join(" ") : (data.message || "Đăng nhập thất bại."));
          return;
        }
        showMessage("ok", "Đăng nhập thành công.");
        try { localStorage.setItem("ticket_rush_tokens", JSON.stringify(data)); } catch (_) {}
      } catch {
        showMessage("error", "Không kết nối được máy chủ.");
      } finally {
        submit.disabled = false;
      }
    });
  </script>
</body>
</html>
