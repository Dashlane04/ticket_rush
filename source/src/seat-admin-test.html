<!DOCTYPE html>
<html>
<head>
<!-- Integrated FontAwesome for professional vector icons -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<style id="base-styles">
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #f0f2f5; display: flex; flex-direction: column; align-items: center; padding: 20px 0; margin: 0; min-height: 100vh;}
    
    /* --- MODALS --- */
    .modal-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(15, 23, 42, 0.8); backdrop-filter: blur(4px); display: flex; justify-content: center; align-items: center; z-index: 1000; }
    .modal-overlay.hidden { display: none; }
    
    .modal-box { background: white; padding: 30px 40px; border-radius: 12px; box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1); text-align: center; max-width: 500px; width: 90%; max-height: 90vh; overflow-y: auto;}
    .modal-box.wide { max-width: 750px; }
    .modal-box h2 { margin-top: 0; color: #1e293b; font-size: 22px; display: flex; justify-content: space-between; align-items: center;}
    .close-modal { background: none; border: none; font-size: 20px; cursor: pointer; color: #94a3b8; transition: 0.2s;}
    .close-modal:hover { color: #0f172a; transform: scale(1.1);}
    
    .input-group { display: flex; justify-content: space-between; margin-bottom: 15px; align-items: center; text-align: left; gap: 15px;}
    .input-group label { font-weight: bold; color: #334155; font-size: 14px; flex: 1;}
    .input-group input, .input-group select { width: 120px; padding: 8px 12px; border: 2px solid #e2e8f0; border-radius: 6px; font-size: 14px; outline: none;}
    .input-group input[type="color"] { padding: 2px 5px; height: 38px; cursor: pointer;}

    .btn-primary { background: #1976d2; color: #fff; border: none; padding: 10px 20px; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 14px; transition: background 0.2s;}
    .btn-primary:hover { background: #1565c0; }
    .btn-success { background: #2e7d32; color: #fff; border: none; padding: 10px 20px; border-radius: 6px; font-weight: bold; cursor: pointer; transition: background 0.2s;}
    
    /* Seat Manager Table */
    .seat-table { width: 100%; border-collapse: collapse; margin-bottom: 20px; text-align: left; font-size: 14px;}
    .seat-table th, .seat-table td { border-bottom: 1px solid #e2e8f0; padding: 12px 8px; vertical-align: middle;}
    .seat-table th { color: #64748b; font-weight: 600; }
    .preview-box { width: 24px; height: 24px; border-radius: 4px; display: inline-block; vertical-align: middle; margin-right: 8px;}
    
    .btn-icon { background: none; border: none; cursor: pointer; font-size: 14px; padding: 6px; border-radius: 4px; transition: 0.2s; opacity: 0.7;}
    .btn-icon:hover { opacity: 1; background: #f1f5f9; }
    .btn-icon.danger { color: #d32f2f; border-left: 2px solid #eee; padding-left: 15px; margin-left: 5px; }
    .btn-icon.danger:hover { background: #fee2e2; }
    
    /* Add/Edit Seat Form */
    .add-seat-form { background: #f8fafc; padding: 15px; border-radius: 8px; border: 1px dashed #cbd5e1; text-align: left;}
    .add-seat-form h3 { margin-top: 0; font-size: 16px; color: #334155; display: flex; align-items: center; gap: 8px;}

    /* --- EDITOR WORKSPACE --- */
    #editor-workspace { display: none; flex-direction: column; align-items: center; width: 100%; }
    #editor-workspace.active { display: flex; }

    /* Dashboard */
    .dashboard { background: #1e293b; color: #fff; width: 90%; max-width: 1200px; border-radius: 10px; padding: 15px 25px; margin-bottom: 15px; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 4px 15px rgba(0,0,0,0.15);}
    .stat-group { display: flex; gap: 20px; font-size: 14px; flex-wrap: wrap;}
    .stat-item { display: flex; align-items: center; gap: 8px; }
    .stat-color { width: 12px; height: 12px; border-radius: 3px; }
    .revenue-box { display: flex; align-items: center; gap: 10px; background: rgba(74, 222, 128, 0.1); padding: 8px 15px; border-radius: 8px; border: 1px solid rgba(74, 222, 128, 0.2);}
    .stat-total { font-weight: bold; font-size: 18px; color: #4ade80; }

    /* Toolbar */
    .admin-panel { background: #fff; padding: 15px 25px; border-radius: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); margin-bottom: 20px; text-align: center; width: 90%; max-width: 1200px; display: flex; justify-content: space-between; align-items: center;}
    .toolbar { display: flex; gap: 8px; align-items: center; flex-wrap: wrap;}
    
    .tool-btn { background: #e0e0e0; color: #555; border: none; padding: 8px 12px; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 13px; transition: all 0.2s; display: flex; align-items: center; gap: 6px;}
    .tool-btn:hover { background: #d5d5d5; }
    .tool-btn.active { background: #1976d2; color: #fff; box-shadow: inset 0 2px 4px rgba(0,0,0,0.2); }
    .shortcut { font-size: 10px; background: rgba(0,0,0,0.1); padding: 2px 5px; border-radius: 4px; margin-left: 4px; font-family: monospace;}
    
    .btn-manage-seats { background: #6366f1; color: white; border: none; padding: 8px 15px; border-radius: 6px; font-weight: bold; cursor: pointer; display: flex; align-items: center; gap: 8px;}
    .btn-manage-seats:hover { background: #4f46e5; }

    .history-group { display: flex; gap: 5px; border-right: 2px solid #eee; padding-right: 15px; margin-right: 5px;}
    .icon-btn { background: none; border: none; font-size: 16px; cursor: pointer; padding: 5px 8px; opacity: 0.4; transition: 0.2s; color: #334155;}
    .icon-btn.active { opacity: 1; color: #1976d2; }
    .icon-btn.danger { color: #d32f2f; opacity: 0.7; border-left: 2px solid #eee; padding-left: 15px; margin-left: 5px; }
    .icon-btn.danger:hover { opacity: 1; }

    /* Grid Layout */
    .screen-container { margin-bottom: 30px; text-align: center; transition: width 0.3s ease; }
    .screen-bar { height: 16px; background: linear-gradient(to bottom, #d1d5db, #e5e7eb); border-radius: 50% / 100% 100% 0 0; margin-bottom: 8px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1);}
    .screen-text { font-weight: 800; color: #9ca3af; letter-spacing: 6px; font-size: 12px; }

    .grid-wrapper { width: 90%; max-width: 95vw; overflow-x: auto; display: flex; flex-direction: column; align-items: center; padding-bottom: 20px;}
    .grid-container { display: flex; align-items: center; gap: 15px; margin-bottom: 20px;}
    .row-labels { display: flex; flex-direction: column; gap: 4px; }
    .row-label { height: 32px; display: flex; align-items: center; justify-content: center; font-weight: bold; color: #999; font-size: 13px; width: 24px;}
    .grid { display: grid; gap: 4px; user-select: none; background: #fff; padding: 25px; border-radius: 12px; box-shadow: 0 8px 25px rgba(0,0,0,0.08); border: 1px solid #e0e0e0;}
    
    .cell-slot { width: 32px; height: 32px; border-radius: 4px; background: #fafafa; border: 1px dashed #d0d0d0; position: relative;}
    .seat { width: 100%; height: 100%; border-radius: 4px; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 700; cursor: crosshair; transition: transform 0.05s; position: absolute; top: 0; left: 0; box-sizing: border-box; overflow: hidden;}
    .seat:hover { transform: scale(1.15); z-index: 10; box-shadow: 0 2px 8px rgba(0,0,0,0.2);}

    .seat.empty { display: none; } 
    .seat.is-blocked { opacity: 0.6; }
    .seat.is-blocked::before { content: ''; position: absolute; width: 140%; height: 2px; background: #d32f2f; transform: rotate(45deg); top: 14px; left: -6px; pointer-events: none; }
    .seat.admin-selected::after { content: ''; position: absolute; top: -4px; left: -4px; right: -4px; bottom: -4px; border: 3px solid #1976d2; border-radius: 6px; pointer-events: none; background: rgba(25, 118, 210, 0.2); }

    /* Bulk Action Panel */
    .bulk-panel { background: #1e293b; color: white; padding: 15px 30px; border-radius: 8px; box-shadow: 0 10px 25px rgba(0,0,0,0.2); display: flex; align-items: center; gap: 15px; position: fixed; bottom: -100px; transition: bottom 0.3s cubic-bezier(0.4, 0, 0.2, 1); z-index: 100; font-size: 14px;}
    .bulk-panel.visible { bottom: 30px; }
    .bulk-panel span { font-weight: bold; margin-right: 15px; }
    .bulk-btn { background: rgba(255,255,255,0.1); color: white; border: 1px solid rgba(255,255,255,0.2); padding: 6px 12px; border-radius: 4px; cursor: pointer; transition: 0.2s; display: flex; align-items: center; gap: 6px;}
    .bulk-btn:hover { background: rgba(255,255,255,0.2); }
    .bulk-btn.danger { border-color: #ef4444; color: #ef4444; }
    .bulk-btn.danger:hover { background: #ef4444; color: white; }
</style>
<style id="dynamic-seat-styles"></style>
</head>
<body>

<!-- SETUP MODAL -->
<div id="setup-modal" class="modal-overlay">
    <div class="modal-box">
        <h2>Seat Map Configuration</h2>
        <div class="input-group">
            <label>Total Rows:</label> <input type="number" id="setup-rows" value="13" min="1" max="100">
        </div>
        <div class="input-group">
            <label>Total Columns:</label> <input type="number" id="setup-cols" value="22" min="1" max="200">
        </div>
        <button class="btn-primary" style="width: 100%; margin-top: 15px;" onclick="startMapping()">Generate Canvas</button>
    </div>
</div>

<!-- VERIFICATION MODAL -->
<div id="verify-modal" class="modal-overlay hidden">
    <div class="modal-box">
        <h2>Confirm Save</h2>
        <p id="verify-text" style="color: #64748b; font-size: 14px; margin-bottom: 25px; line-height: 1.5;"></p>
        <div style="display: flex; gap: 10px;">
            <button class="btn-primary" style="background: #f1f5f9; color: #475569; width: 100%;" onclick="closeVerifyModal()">Cancel</button>
            <button class="btn-success" style="width: 100%;" onclick="executeSave()">Confirm & Save</button>
        </div>
    </div>
</div>

<!-- SEAT MANAGER MODAL -->
<div id="seat-manager-modal" class="modal-overlay hidden">
    <div class="modal-box wide">
        <h2>Manage Seat Types <button class="close-modal" onclick="closeSeatManager()"><i class="fa-solid fa-xmark"></i></button></h2>
        
        <table class="seat-table">
            <thead><tr><th>Preview</th><th>Name</th><th>Style</th><th>Text</th><th>Price</th><th>Actions</th></tr></thead>
            <tbody id="seat-types-list">
                <!-- Populated by JS -->
            </tbody>
        </table>

        <div class="add-seat-form">
            <h3 id="seat-form-title"><i class="fa-solid fa-plus"></i> Create New Seat Type</h3>
            <div style="display: flex; gap: 15px; flex-wrap: wrap;">
                <div class="input-group" style="flex: 1;"><label>Name:</label> <input type="text" id="new-seat-name" placeholder="e.g. Balcony"></div>
                <div class="input-group"><label>Price ($):</label> <input type="number" id="new-seat-price" value="0" min="0" style="width:70px"></div>
                <div class="input-group"><label>Color:</label> <input type="color" id="new-seat-color" value="#8b5cf6"></div>
            </div>
            <div style="display: flex; gap: 15px; flex-wrap: wrap; margin-top: 10px;">
                <div class="input-group" style="flex: 1;">
                    <label>Fill Style:</label> 
                    <select id="new-seat-fill">
                        <option value="false">Outline (White Background)</option>
                        <option value="true">Solid Fill (Colored Background)</option>
                    </select>
                </div>
                <div class="input-group" style="flex: 1;">
                    <label>Text Color:</label> 
                    <select id="new-seat-text">
                        <option value="#000000">Black</option>
                        <option value="#ffffff">White</option>
                    </select>
                </div>
            </div>
            <div style="margin-top: 15px; display: flex; align-items: center;">
                <button class="btn-primary" id="btn-save-seat" onclick="saveSeatType()">Add Type</button>
                <button class="btn-icon" id="btn-cancel-edit" style="display:none; margin-left: 10px;" onclick="cancelEdit()"><i class="fa-solid fa-xmark"></i> Cancel Edit</button>
            </div>
        </div>
    </div>
</div>

<!-- MAIN WORKSPACE -->
<div id="editor-workspace">
    <div class="dashboard">
        <div class="stat-group" id="dashboard-stats"></div>
        <div class="revenue-box">
            <span>Max Revenue:</span>
            <span class="stat-total" id="stat-revenue">$0</span>
        </div>
    </div>

    <div class="admin-panel">
        <div class="toolbar" id="toolbar">
            <div class="history-group">
                <button class="icon-btn" id="btn-undo" onclick="undo()" title="Undo (Ctrl+Z)"><i class="fa-solid fa-rotate-left"></i></button>
                <button class="icon-btn" id="btn-redo" onclick="redo()" title="Redo (Ctrl+Y)"><i class="fa-solid fa-rotate-right"></i></button>
                <button class="icon-btn danger" onclick="resetMap()" title="Clear All Seats"><i class="fa-solid fa-trash-can"></i></button>
            </div>
            <div style="margin-right: 15px;">
                <button class="btn-manage-seats" onclick="openSeatManager()"><i class="fa-solid fa-gear"></i> Config & Pricing</button>
            </div>
            <div id="dynamic-tools" style="display: flex; gap: 8px;"></div>
        </div>
        <button class="btn-success" onclick="promptSave()">Save</button>
    </div>

    <div class="grid-wrapper">
        <div class="screen-container" id="screen-display">
            <div class="screen-bar"></div><div class="screen-text">SCREEN</div>
        </div>
        <div class="grid-container">
            <div class="row-labels" id="left-labels"></div>
            <div id="seat-grid" class="grid"></div>
            <div class="row-labels" id="right-labels"></div>
        </div>
    </div>
</div>

<div class="bulk-panel" id="bulk-panel">
    <span id="bulk-count">0 Selected</span>
    <div id="dynamic-bulk-actions" style="display:flex; gap:10px;"></div>
    <button class="bulk-btn danger" onclick="bulkToggleBlock()" style="margin-left: 10px;"><i class="fa-solid fa-ban"></i> Toggle Blocked</button>
    <button class="bulk-btn" onclick="clearSelection()" style="margin-left: 15px;">Deselect All (Esc)</button>
</div>

<script>
    // --- DYNAMIC DATA CONFIGURATION ---
    let seatConfig = {
        'normal': { name: 'Normal', color: '#2e7d32', isFill: false, textColor: '#000000', price: 15 },
        'vip': { name: 'VIP', color: '#e91e63', isFill: false, textColor: '#000000', price: 40 },
        'sweetbox': { name: 'Sweetbox', color: '#e91e63', isFill: true, textColor: '#ffffff', price: 65 }
    };

    let ROWS = 13, COLS = 22; 
    let currentTool = 'select', isDrawing = false, anchor = null, targetSelectState = true, dragSnapshot = new Map(); 
    let history = [], historyIndex = -1;
    let editingSeatId = null;

    const grid = document.getElementById('seat-grid');
    const dynamicStyles = document.getElementById('dynamic-seat-styles');
    const bulkPanel = document.getElementById('bulk-panel');

    // --- ENGINE: STYLES & UI GENERATION ---
    function buildDynamicSystem() {
        let cssStr = '';
        let toolsHTML = `<button class="tool-btn active" data-tool="select"><i class="fa-solid fa-arrow-pointer"></i> Select <span class="shortcut">1</span></button>`;
        let statsHTML = ``;
        let bulkHTML = ``;
        let shortcutIndex = 2;

        for (const [id, config] of Object.entries(seatConfig)) {
            if (config.isFill) cssStr += `.seat[data-type="${id}"] { background: ${config.color}; color: ${config.textColor}; border: none; }\n`;
            else cssStr += `.seat[data-type="${id}"] { background: #fff; color: ${config.textColor}; border: 2px solid ${config.color}; }\n`;

            let previewStyle = config.isFill ? `background:${config.color};` : `border: 2px solid ${config.color};`;
            toolsHTML += `<button class="tool-btn" data-tool="${id}">
                <div style="width:12px;height:12px;border-radius:2px;${previewStyle}"></div> 
                ${config.name} <span class="shortcut">${shortcutIndex++}</span>
            </button>`;

            statsHTML += `<div class="stat-item"><div class="stat-color" style="${previewStyle}"></div> <span id="stat-${id}">0 ${config.name}</span></div>`;
            bulkHTML += `<button class="bulk-btn" onclick="bulkChangeType('${id}')">Set ${config.name}</button>`;
        }

        toolsHTML += `<button class="tool-btn" data-tool="empty"><i class="fa-solid fa-eraser"></i> Erase <span class="shortcut">${shortcutIndex}</span></button>`;
        statsHTML += `<div class="stat-item"><div class="stat-color" style="background:#64748b"></div> <span id="stat-blocked">0 Blocked</span></div>`;

        dynamicStyles.innerHTML = cssStr;
        document.getElementById('dynamic-tools').innerHTML = toolsHTML;
        document.getElementById('dashboard-stats').innerHTML = statsHTML;
        document.getElementById('dynamic-bulk-actions').innerHTML = bulkHTML;

        document.querySelectorAll('.tool-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                document.querySelectorAll('.tool-btn').forEach(b => b.classList.remove('active'));
                e.currentTarget.classList.add('active');
                currentTool = e.currentTarget.dataset.tool;
            });
        });

        if(!seatConfig[currentTool] && currentTool !== 'select' && currentTool !== 'empty') currentTool = 'select';
        const activeBtn = document.querySelector(`.tool-btn[data-tool="${currentTool}"]`);
        if(activeBtn) activeBtn.classList.add('active');
    }

    // --- SEAT MANAGER CRUD LOGIC ---
    function openSeatManager() {
        const tbody = document.getElementById('seat-types-list');
        tbody.innerHTML = '';
        
        for (const [id, config] of Object.entries(seatConfig)) {
            let previewStyle = config.isFill ? `background:${config.color};` : `background:#fff; border: 2px solid ${config.color};`;
            
            tbody.innerHTML += `
                <tr>
                    <td><div class="preview-box" style="${previewStyle}"></div></td>
                    <td><strong>${config.name}</strong></td>
                    <td>${config.isFill ? "Solid Fill" : "Outline"}</td>
                    <td><span style="background:#eee; padding:2px 6px; border-radius:4px;">${config.textColor === '#ffffff' ? 'White' : 'Black'}</span></td>
                    <td>$${config.price}</td>
                    <td>
                        <button class="btn-icon" onclick="editSeatType('${id}')" title="Edit"><i class="fa-solid fa-pen"></i></button>
                        ${id !== 'normal' ? `<button class="btn-icon danger" onclick="deleteSeatType('${id}')" title="Delete"><i class="fa-solid fa-trash-can"></i></button>` : ''}
                    </td>
                </tr>
            `;
        }
        document.getElementById('seat-manager-modal').classList.remove('hidden');
    }

    function closeSeatManager() { 
        document.getElementById('seat-manager-modal').classList.add('hidden'); 
        cancelEdit();
    }

    function editSeatType(id) {
        editingSeatId = id;
        const config = seatConfig[id];
        
        document.getElementById('new-seat-name').value = config.name;
        document.getElementById('new-seat-price').value = config.price;
        document.getElementById('new-seat-color').value = config.color;
        document.getElementById('new-seat-fill').value = config.isFill.toString();
        document.getElementById('new-seat-text').value = config.textColor;

        document.getElementById('seat-form-title').innerHTML = `<i class="fa-solid fa-pen"></i> Editing: <strong>${config.name}</strong>`;
        document.getElementById('btn-save-seat').textContent = 'Update Type';
        document.getElementById('btn-cancel-edit').style.display = 'inline-block';
    }

    function cancelEdit() {
        editingSeatId = null;
        document.getElementById('new-seat-name').value = '';
        document.getElementById('new-seat-price').value = '0';
        document.getElementById('new-seat-color').value = '#8b5cf6';
        
        document.getElementById('seat-form-title').innerHTML = `<i class="fa-solid fa-plus"></i> Create New Seat Type`;
        document.getElementById('btn-save-seat').textContent = 'Add Type';
        document.getElementById('btn-cancel-edit').style.display = 'none';
    }

    function saveSeatType() {
        const name = document.getElementById('new-seat-name').value.trim();
        if(!name) return alert("Please enter a name.");
        
        let id = editingSeatId;
        if (!id) {
            id = name.toLowerCase().replace(/[^a-z0-9]/g, '-');
            if(seatConfig[id]) return alert("A seat type with a similar name already exists.");
        }

        seatConfig[id] = {
            name: name,
            price: parseFloat(document.getElementById('new-seat-price').value) || 0,
            color: document.getElementById('new-seat-color').value,
            isFill: document.getElementById('new-seat-fill').value === 'true',
            textColor: document.getElementById('new-seat-text').value
        };

        cancelEdit(); buildDynamicSystem(); recalculateSeatNumbers(); openSeatManager(); 
    }

    function deleteSeatType(id) {
        if(!confirm(`Are you sure you want to delete the "${seatConfig[id].name}" tier?\n\nAny existing seats of this type on the map will be converted to Normal seats.`)) return;

        document.querySelectorAll(`.seat[data-type="${id}"]`).forEach(seat => { seat.dataset.type = 'normal'; });
        delete seatConfig[id];
        
        buildDynamicSystem(); recalculateSeatNumbers(); openSeatManager(); saveHistoryState(); updateBulkUI(); 
    }

    // --- SETUP & GRID LOGIC ---
    function startMapping() {
        ROWS = parseInt(document.getElementById('setup-rows').value) || 13;
        COLS = parseInt(document.getElementById('setup-cols').value) || 22;
        document.getElementById('setup-modal').classList.add('hidden');
        document.getElementById('editor-workspace').classList.add('active');
        
        buildDynamicSystem();
        initGrid();
        document.getElementById('screen-display').style.width = `${Math.min((COLS * 36) - 4, 1000)}px`;
    }

    function getRowLetter(index) {
        let res = "", num = index;
        while (num >= 0) { res = "ABCDEFGHJKLMNOPQRSTUVWXYZ"[num % 25] + res; num = Math.floor(num / 25) - 1; }
        return res;
    }

    function initGrid() {
        grid.style.gridTemplateColumns = `repeat(${COLS}, 32px)`;
        grid.innerHTML = ''; document.getElementById('left-labels').innerHTML = ''; document.getElementById('right-labels').innerHTML = '';
        for (let r = 0; r < ROWS; r++) {
            const rowLetter = getRowLetter(r);
            document.getElementById('left-labels').innerHTML += `<div class="row-label">${rowLetter}</div>`;
            document.getElementById('right-labels').innerHTML += `<div class="row-label">${rowLetter}</div>`;
            for (let c = 0; c < COLS; c++) {
                const slot = document.createElement('div');
                slot.className = 'cell-slot'; slot.dataset.r = r; slot.dataset.c = c;
                const seat = document.createElement('div');
                seat.className = 'seat'; seat.dataset.type = 'normal'; seat.dataset.blocked = 'false';
                slot.appendChild(seat);
                slot.addEventListener('mousedown', (e) => startDrag(e, r, c));
                slot.addEventListener('mouseenter', (e) => updateDrag(r, c));
                slot.ondragstart = () => false;
                grid.appendChild(slot);
            }
        }
        recalculateSeatNumbers(); history = []; historyIndex = -1; saveHistoryState();
    }

    function resetMap() {
        if(confirm("Are you sure you want to clear all seats? This cannot be undone.")) {
            document.querySelectorAll('.seat').forEach(seat => { 
                seat.className = 'seat empty'; 
                seat.dataset.type = 'empty'; 
                seat.dataset.blocked = 'false'; 
                seat.classList.remove('admin-selected');
            });
            recalculateSeatNumbers(); saveHistoryState(); clearSelection();
        }
    }

    // --- DRAG LOGIC ---
    window.addEventListener('mouseup', () => { 
        if (isDrawing) { isDrawing = false; updateBulkUI(); if (currentTool !== 'select') saveHistoryState(); } 
    });
    
    function getSeatEl(r, c) { return document.querySelector(`.cell-slot[data-r="${r}"][data-c="${c}"] .seat`); }

    function startDrag(e, r, c) {
        if (e.button !== 0) return; 
        isDrawing = true; anchor = { r, c }; dragSnapshot.clear();
        document.querySelectorAll('.cell-slot').forEach(slot => {
            const seat = slot.querySelector('.seat');
            dragSnapshot.set(`${slot.dataset.r}-${slot.dataset.c}`, { type: seat.dataset.type, selected: seat.classList.contains('admin-selected') });
        });
        const anchorSeat = getSeatEl(r, c);
        if (currentTool === 'select') targetSelectState = !anchorSeat.classList.contains('admin-selected');
        updateDrag(r, c);
    }

    function updateDrag(currentR, currentC) {
        if (!isDrawing) return;
        const minR = Math.min(anchor.r, currentR), maxR = Math.max(anchor.r, currentR);
        const minC = Math.min(anchor.c, currentC), maxC = Math.max(anchor.c, currentC);
        document.querySelectorAll('.cell-slot').forEach(slot => {
            const r = parseInt(slot.dataset.r), c = parseInt(slot.dataset.c), seat = slot.querySelector('.seat');
            const snap = dragSnapshot.get(`${r}-${c}`);
            if (r >= minR && r <= maxR && c >= minC && c <= maxC) {
                if (currentTool === 'select') {
                    if (seat.dataset.type !== 'empty') seat.classList.toggle('admin-selected', targetSelectState);
                } else {
                    seat.dataset.type = currentTool;
                    seat.classList.toggle('is-blocked', seat.dataset.blocked === 'true');
                    if (snap.selected && currentTool !== 'empty') seat.classList.add('admin-selected');
                }
            } else {
                seat.dataset.type = snap.type;
                if (snap.selected) seat.classList.add('admin-selected');
            }
        });
        recalculateSeatNumbers(); 
    }

    // --- BULK LOGIC ---
    function updateBulkUI() {
        const count = document.querySelectorAll('.seat.admin-selected').length;
        if (count > 0) {
            document.getElementById('bulk-count').textContent = `${count} Selected`;
            bulkPanel.classList.add('visible');
        } else {
            bulkPanel.classList.remove('visible');
        }
    }

    function bulkChangeType(newType) {
        document.querySelectorAll('.seat.admin-selected').forEach(seat => { seat.dataset.type = newType; });
        recalculateSeatNumbers(); saveHistoryState();
    }

    function bulkToggleBlock() {
        document.querySelectorAll('.seat.admin-selected').forEach(seat => {
            const isBlocked = seat.dataset.blocked === 'true';
            seat.dataset.blocked = !isBlocked;
            seat.classList.toggle('is-blocked', !isBlocked);
        });
        recalculateSeatNumbers(); saveHistoryState();
    }

    function clearSelection() {
        document.querySelectorAll('.seat.admin-selected').forEach(s => s.classList.remove('admin-selected'));
        updateBulkUI();
    }

    // --- RECALCULATE & DASHBOARD ---
    function recalculateSeatNumbers() {
        let stats = { blocked: 0 };
        for (const id in seatConfig) stats[id] = 0;
        let totalRevenue = 0;

        for (let r = 0; r < ROWS; r++) {
            let seatCounter = 1;
            const rowLetter = getRowLetter(r);
            for (let c = 0; c < COLS; c++) {
                const seat = getSeatEl(r, c);
                seat.className = `seat ${seat.dataset.blocked === 'true' ? 'is-blocked' : ''} ${seat.classList.contains('admin-selected') ? 'admin-selected' : ''}`;
                
                if (seat.dataset.type !== 'empty') {
                    seat.textContent = seatCounter;
                    seat.dataset.seatId = `${rowLetter}${seatCounter}`;
                    seat.dataset.gridX = c; seat.dataset.gridY = r; 
                    seatCounter++;

                    const typeId = seat.dataset.type;
                    if(stats[typeId] !== undefined) stats[typeId]++;
                    if (seat.dataset.blocked === 'true') stats.blocked++;
                    else if (seatConfig[typeId]) totalRevenue += seatConfig[typeId].price; 
                } else {
                    seat.textContent = ''; seat.dataset.seatId = ''; seat.classList.add('empty'); seat.classList.remove('admin-selected'); 
                }
            }
        }
        
        for (const id in seatConfig) {
            const el = document.getElementById(`stat-${id}`);
            if(el) el.textContent = `${stats[id]} ${seatConfig[id].name}`;
        }
        document.getElementById('stat-blocked').textContent = `${stats.blocked} Blocked`;
        document.getElementById('stat-revenue').textContent = `$${totalRevenue.toLocaleString()}`;
    }

    // --- HISTORY ---
    function saveHistoryState() {
        const state = Array.from(document.querySelectorAll('.cell-slot')).map(s => ({ type: s.querySelector('.seat').dataset.type, blocked: s.querySelector('.seat').dataset.blocked }));
        history = history.slice(0, historyIndex + 1); history.push(state); historyIndex++;
        document.getElementById('btn-undo').classList.toggle('active', historyIndex > 0);
        document.getElementById('btn-redo').classList.toggle('active', historyIndex < history.length - 1);
    }

    function loadHistoryState(index) {
        if (index < 0 || index >= history.length) return;
        document.querySelectorAll('.cell-slot').forEach((slot, i) => {
            const seat = slot.querySelector('.seat'), saved = history[index][i];
            seat.dataset.type = saved.type; seat.dataset.blocked = saved.blocked; seat.classList.remove('admin-selected'); 
        });
        historyIndex = index; recalculateSeatNumbers(); updateBulkUI();
        document.getElementById('btn-undo').classList.toggle('active', historyIndex > 0);
        document.getElementById('btn-redo').classList.toggle('active', historyIndex < history.length - 1);
    }
    function undo() { loadHistoryState(historyIndex - 1); }
    function redo() { loadHistoryState(historyIndex + 1); }

    document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape') clearSelection();
        if (e.ctrlKey && e.key.toLowerCase() === 'z') { e.preventDefault(); undo(); }
        if (e.ctrlKey && e.key.toLowerCase() === 'y') { e.preventDefault(); redo(); }
    });

    // --- VERIFICATION & API EXPORT ---
    function promptSave() {
        const totalActive = document.querySelectorAll('.seat:not(.empty)').length;
        const totalBlocked = document.querySelectorAll('.seat.is-blocked:not(.empty)').length;
        const revenue = document.getElementById('stat-revenue').textContent;
        
        document.getElementById('verify-text').innerHTML = `
            You are about to save a template with <strong style="color:#1e293b">${totalActive} active seats</strong> (${totalBlocked} blocked).<br><br>
            Estimated Maximum Revenue Capacity: <strong style="color:#4ade80">${revenue}</strong>.<br><br>
            Do you wish to proceed and lock in this layout?`;
        
        document.getElementById('verify-modal').classList.remove('hidden');
    }

    function closeVerifyModal() {
        document.getElementById('verify-modal').classList.add('hidden');
    }

    async function executeSave() {
    closeVerifyModal();
    
    // 1. Ask the admin for the template details (matches your backend DTO)
    const templateName = prompt('Enter a name for this template:', 'Standard Cinema Layout');
    if (!templateName) return; // Abort if they click 'Cancel'
    
    const hallName = prompt('Which hall does this layout belong to?', 'Hall A');
    if (!hallName) return; // Abort if they click 'Cancel'

    // 2. Gather the physical grid data
    const layout = [];
    document.querySelectorAll('.seat:not(.empty)').forEach(seat => {
        layout.push({ 
            id: seat.dataset.seatId, 
            gridCol: parseInt(seat.dataset.gridX), 
            gridRow: parseInt(seat.dataset.gridY), 
            type: seat.dataset.type, 
            isBlocked: seat.dataset.blocked === 'true' 
        });
    });

    // 3. Construct the exact payload your NestJS API expects
    const apiPayload = { 
        templateName: templateName,
        hallName: hallName,
        dimensions: { rows: ROWS, columns: COLS }, 
        seatConfiguration: seatConfig, 
        layout: layout 
    };

    console.log("SENDING PAYLOAD TO API:", apiPayload);

    // 4. Fire the request to your backend
    try {
        // Change the URL if your NestJS server is running on a different port/domain
        const response = await fetch('http://localhost:3000/admin/seat-template', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify(apiPayload)
        });

        if (!response.ok) {
            throw new Error(`HTTP error! status: ${response.status}`);
        }

        const result = await response.json();
        
        // 5. Success feedback
        console.log("SERVER RESPONSE:", result);
        alert(`Success! Template '${result.templateName}' saved with ${result.savedSeats} active seats.`);
        
    } catch (error) {
        // 6. Error feedback
        console.error("Failed to save template to the database:", error);
        alert("Failed to save template. Please make sure your NestJS backend is running and check the console.");
    }
}
</script>
