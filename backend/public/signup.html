<!DOCTYPE html>
<!-- Giao diện chính: Next.js (fe/frontend) chạy cổng 3001 — đăng nhập/đăng ký. Trang này gọi trực tiếp API Nest, dùng cùng localStorage ticket_rush_tokens. -->
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Đăng ký — Ticket Rush</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --page-bg: #0d1117;
      --card-bg: #1a1f2b;
      --input-bg: #0f172a;
      --accent: #e91e63;
      --accent-hover: #f06292;
      --text: #ffffff;
      --muted: #a8b0c4;
      --border: rgba(255, 255, 255, 0.08);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      font-family: "DM Sans", system-ui, sans-serif;
      background: var(--page-bg);
      color: var(--text);
    }

    .card {
      width: 100%;
      max-width: 420px;
      background: var(--card-bg);
      border-radius: 20px;
      padding: 40px 36px 36px;
      box-shadow: 0 24px 48px rgba(0, 0, 0, 0.45);
    }

    h1 {
      margin: 0 0 10px;
      font-family: "Playfair Display", Georgia, serif;
      font-size: 2rem;
      font-weight: 700;
      text-align: center;
      letter-spacing: 0.02em;
    }

    .subtitle {
      margin: 0 0 32px;
      text-align: center;
      font-size: 0.9375rem;
      color: var(--muted);
      line-height: 1.5;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-size: 0.875rem;
      font-weight: 500;
      color: var(--muted);
    }

    .field {
      margin-bottom: 20px;
    }

    .input-wrap {
      display: flex;
      align-items: center;
      gap: 12px;
      background: var(--input-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 0 14px;
      transition: border-color 0.15s ease, box-shadow 0.15s ease;
    }

    .input-wrap:focus-within {
      border-color: rgba(233, 30, 99, 0.45);
      box-shadow: 0 0 0 3px rgba(233, 30, 99, 0.12);
    }

    .input-wrap svg {
      flex-shrink: 0;
      opacity: 0.65;
    }

    input {
      flex: 1;
      min-width: 0;
      border: none;
      background: transparent;
      color: var(--text);
      font: inherit;
      font-size: 0.9375rem;
      padding: 14px 0;
      outline: none;
    }

    input::placeholder {
      color: #5c6578;
    }

    .submit {
      width: 100%;
      margin-top: 8px;
      padding: 16px 20px;
      border: none;
      border-radius: 999px;
      background: var(--accent);
      color: #fff;
      font: inherit;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      transition: background 0.15s ease, transform 0.1s ease;
    }

    .submit:hover {
      background: var(--accent-hover);
    }

    .submit:active {
      transform: scale(0.98);
    }

    .submit:disabled {
      opacity: 0.65;
      cursor: not-allowed;
      transform: none;
    }

    .footer {
      margin-top: 28px;
      text-align: center;
      font-size: 0.9375rem;
      color: var(--muted);
    }

    .footer a {
      color: var(--accent);
      text-decoration: none;
      font-weight: 600;
    }

    .footer a:hover {
      text-decoration: underline;
    }

    .msg {
      margin-bottom: 16px;
      padding: 12px 14px;
      border-radius: 10px;
      font-size: 0.875rem;
      line-height: 1.4;
      display: none;
    }

    .msg.show {
      display: block;
    }

    .msg.error {
      background: rgba(233, 30, 99, 0.12);
      color: #ffb3c9;
      border: 1px solid rgba(233, 30, 99, 0.35);
    }

    .msg.ok {
      background: rgba(46, 160, 67, 0.15);
      color: #7ee0a0;
      border: 1px solid rgba(46, 160, 67, 0.35);
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Đăng Ký</h1>
    <p class="subtitle">Trở thành hội viên để săn vé nhanh nhất</p>

    <div id="msg" class="msg" role="alert"></div>

    <form id="form" novalidate>
      <div class="field">
        <label for="name">Họ và Tên</label>
        <div class="input-wrap">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2" />
            <circle cx="12" cy="7" r="4" />
          </svg>
          <input id="name" name="name" type="text" autocomplete="name" placeholder="Nguyễn Văn A" required />
        </div>
      </div>

      <div class="field">
        <label for="email">Email</label>
        <div class="input-wrap">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
            <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z" />
            <polyline points="22,6 12,13 2,6" />
          </svg>
          <input id="email" name="email" type="email" autocomplete="email" placeholder="hello@example.com" required />
        </div>
      </div>

      <div class="field">
        <label for="password">Mật khẩu</label>
        <div class="input-wrap">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
            <rect x="3" y="11" width="18" height="11" rx="2" ry="2" />
            <path d="M7 11V7a5 5 0 0 1 10 0v4" />
          </svg>
          <input id="password" name="password" type="password" autocomplete="new-password" placeholder="••••••••" required minlength="6" />
        </div>
      </div>

      <div class="field">
        <label for="confirmPassword">Xác nhận mật khẩu</label>
        <div class="input-wrap">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
            <rect x="3" y="11" width="18" height="11" rx="2" ry="2" />
            <path d="M7 11V7a5 5 0 0 1 10 0v4" />
          </svg>
          <input id="confirmPassword" name="confirmPassword" type="password" autocomplete="new-password" placeholder="••••••••" required minlength="6" />
        </div>
      </div>

      <button type="submit" class="submit" id="submit">
        Tạo Tài Khoản
        <span aria-hidden="true">→</span>
      </button>
    </form>

    <p class="footer">
      Đã có tài khoản?
      <a href="/login.html">Đăng nhập</a>
    </p>
  </div>

  <script>
    const form = document.getElementById("form");
    const msg = document.getElementById("msg");
    const submit = document.getElementById("submit");

    function showMessage(type, text) {
      msg.className = "msg show " + type;
      msg.textContent = text;
    }

    function hideMessage() {
      msg.className = "msg";
      msg.textContent = "";
    }

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      hideMessage();

      const name = document.getElementById("name").value.trim();
      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;
      const confirmPassword = document.getElementById("confirmPassword").value;

      if (password !== confirmPassword) {
        showMessage("error", "Mật khẩu xác nhận không khớp.");
        return;
      }

      submit.disabled = true;
      try {
        const res = await fetch("/auth/register", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ name, email, password, confirmPassword }),
        });
        const data = await res.json().catch(() => ({}));

        if (!res.ok) {
          const errText = Array.isArray(data.message)
            ? data.message.join(" ")
            : data.message || "Đăng ký thất bại.";
          showMessage("error", errText);
          return;
        }

        showMessage("ok", "Đăng ký thành công! Bạn có thể đăng nhập.");
        form.reset();
        try {
          localStorage.setItem("ticket_rush_tokens", JSON.stringify(data));
        } catch (_) {}
      } catch {
        showMessage("error", "Không kết nối được máy chủ.");
      } finally {
        submit.disabled = false;
      }
    });
  </script>
</body>
</html>
